<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf9fc">
<title>活动档案｜探Q活动回忆档案馆</title>
<style>
:root{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Microsoft YaHei",system-ui,sans-serif;color:#2c3041;background:#faf9fc}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8751ad;outline-offset:3px}
header{background:#fff;border-bottom:1px solid #eee9f3}.head-inner{max-width:1180px;margin:auto;padding:15px 25px;min-height:78px;display:flex;gap:20px;justify-content:space-between;align-items:center}
.brand{display:flex;gap:10px;align-items:center;text-decoration:none;color:#49345b;font-size:18px;font-weight:850}.brand-mark{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:#9862bc;color:#fff;font-size:25px}
nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}nav a,nav span{padding:9px 12px;border-radius:10px;font-weight:750;font-size:14px}nav a{background:#f1eaf7;color:#49345b;text-decoration:none}nav span{color:#777182}
main{max-width:1180px;margin:auto;padding:30px 25px 70px}.eyebrow{display:inline-block;padding:6px 12px;border-radius:30px;background:#f0e9f6;color:#714b92;font-size:12px;font-weight:850}
h1{font-size:clamp(26px,3vw,37px);margin:13px 0 9px}.lead{font-size:14px;color:#646078;line-height:1.8;max-width:760px;margin:0 0 14px}.notice{font-size:12px;color:#736d7c;line-height:1.8;margin:0 0 22px}
.panel{background:#fff;border:1px solid #ebe5f0;border-radius:20px;box-shadow:0 8px 25px #34234408;padding:22px}
.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:20px}.field{display:grid;gap:7px;min-width:0}.field label{font-size:12px;font-weight:800;color:#70657b}
.field select,.field input{width:100%;min-width:0;min-height:44px;background:#fff;border:1px solid #dad3e5;border-radius:11px;padding:10px 12px;color:#2c3041;font-size:16px}
.field.search,.field.month-field,.field.date-field{grid-column:span 2}
.summary{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:18px}.summary h2{margin:0;color:#49345b;font-size:21px}.summary p{margin:7px 0 0;font-size:13px;color:#716a7b;line-height:1.6}
.count{border-radius:30px;padding:7px 12px;background:#f1eaf7;color:#624083;font-weight:850;font-size:12px}
.list{display:grid;gap:14px}.entry{border:1px solid #eae3ef;border-radius:16px;overflow:hidden;background:#fff}.entry-banner{padding:11px 16px;background:linear-gradient(115deg,#fff3fa,#f0f8fe);font-size:12px;color:#6c4b83;font-weight:850}
.entry-body{padding:17px}.entry-body h3{margin:8px 0 11px;line-height:1.55;font-size:18px;overflow-wrap:anywhere}.tag{display:inline-block;background:#f0eaf8;color:#704296;padding:5px 9px;border-radius:30px;font-size:11px;font-weight:800}
.meta{font-size:13px;line-height:1.8;color:#5d5d6b;margin:4px 0}.note{font-size:12px;line-height:1.75;color:#776d7f;margin:11px 0}
.detail{display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin-top:10px;padding:10px 15px;background:#f0eaf8;border:0;border-radius:10px;color:#674185;font-size:13px;text-decoration:none;font-weight:850}.detail:hover{background:#e6d6f1}
.empty{padding:30px 18px;border:1px dashed #d9cde5;border-radius:14px;text-align:center;color:#70687a;font-size:13px;line-height:1.8}.empty strong{display:block;color:#49345b;margin-bottom:7px}
footer{max-width:1180px;margin:auto;padding:0 25px 30px;font-size:12px;color:#716e7c;line-height:1.8}
@media(max-width:750px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.head-inner{display:block;padding:14px 15px}.brand{font-size:16px}nav{margin-top:12px;gap:5px}nav a,nav span{font-size:12px;padding:7px 9px}main{padding:23px 12px 50px}.panel{padding:15px;border-radius:16px}.filters{grid-template-columns:1fr 1fr;gap:10px}.field.search,.field.month-field,.field.date-field{grid-column:1/-1}.entry-body{padding:14px}footer{padding:0 14px 24px}}
</style>
<link rel="stylesheet" href="./assets/theme-v12.css">
</head>
<body>
<header class="site-header"><div class="head-inner">
<a class="brand" href="./home.html"><span class="brand-mark" aria-hidden="true">⌕</span>探Q活动回忆档案馆</a>
<nav class="site-nav" aria-label="网站导航"><a href="./home.html">首页</a><a href="./index.html">活动日历</a><a href="./map.html">活动地图</a><a href="./archive.html" aria-current="page">活动档案</a><span title="尚未开发">关于 · 开发中</span></nav>
</div></header>
<main>
<span class="eyebrow">2026 · 探Q活动档案 · 浏览原型</span><h1>活动档案</h1>
<p class="lead">按日期、地区、类型或关键词，找回2026年的探Q活动记录。也可以从日历和地图带着筛选条件来到这里。</p>
<p class="notice">目前只有一条待正式公开核验的 Staff Talk 演示记录，本站不是2026年完整活动清单。没有匹配记录不代表活动从未举办。</p>
<section class="panel filters" aria-label="档案筛选">
<div class="field"><label for="mode">时间范围</label><select id="mode"><option value="all">2026全年</option><option value="month">整月</option><option value="day">单日</option></select></div>
<div class="field"><label for="region">地区</label><select id="region"><option value="all">所有地区</option><option value="tokyo">东京都</option><option value="other">其他地区</option></select></div>
<div class="field"><label for="category">活动类型</label><select id="category"><option value="all">所有类型</option><option value="staff_talk">制作人员座谈</option><option value="other">其他类型</option></select></div>
<div class="field"><label for="clear">重置条件</label><button type="button" class="detail" id="clear">查看全年全部档案</button></div>
<div class="field month-field" id="month-field" hidden><label for="month">月份</label><select id="month"></select></div>
<div class="field date-field" id="date-field" hidden><label for="date">日期</label><input id="date" type="date" min="2026-01-01" max="2026-12-31"></div>
<div class="field search"><label for="keyword">搜索名称、场馆或地区</label><input id="keyword" type="search" placeholder="例如：Staff Talk、新宿" maxlength="120" autocomplete="off"></div>
</section>
<section class="panel" aria-labelledby="result-heading"><div class="summary"><div><h2 id="result-heading">已收录档案</h2><p id="filter-summary" aria-live="polite"></p></div><span class="count" id="count">载入中</span></div><div class="list" id="list" aria-live="polite"><p>正在载入演示活动……</p></div></section>
</main>
<footer>非官方粉丝档案原型。活动资料仍待核验补全，列表的“无记录”不代表历史上没有相关活动。</footer>
<script>
"use strict";
const $=id=>document.getElementById(id);
const validMonth=v=>/^(?:[1-9]|1[0-2])$/.test(String(v));
const validDate=v=>typeof v==="string"&&/^2026-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/.test(v)&&(()=>{const [y,m,d]=v.split("-").map(Number);return new Date(y,m-1,d).getMonth()===m-1;})();
const dateOf=(m,d)=>"2026-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");
function readState(params){
 const month=validMonth(params.get("month"))?Number(params.get("month")):10;
 const date=validDate(params.get("date"))?params.get("date"):dateOf(month,15);
 const mode=["all","month","day"].includes(params.get("mode"))?params.get("mode"):"all";
 return {mode,month:mode==="day"?Number(date.slice(5,7)):month,date,
  region:["all","tokyo","other"].includes(params.get("region"))?params.get("region"):"all",
  category:["all","staff_talk","other"].includes(params.get("category"))?params.get("category"):"all",
  keyword:(params.get("q")||"").slice(0,120)};
}
let state=readState(new URLSearchParams(location.search)),events=[];
function stateQuery(){
 const q=new URLSearchParams();
 if(state.mode!=="all"){q.set("mode",state.mode);q.set("month",String(state.month));if(state.mode==="day")q.set("date",state.date);}
 if(state.region!=="all")q.set("region",state.region);
 if(state.category!=="all")q.set("category",state.category);
 if(state.keyword.trim())q.set("q",state.keyword.trim());
 return q;
}
function persist(replace=false){
 const q=stateQuery().toString();
 history[replace?"replaceState":"pushState"](null,"",location.pathname+(q?"?"+q:""));
}
function matches(e){
 const start=state.mode==="all"?"2026-01-01":state.mode==="month"?dateOf(state.month,1):state.date;
 const end=state.mode==="all"?"2026-12-31":state.mode==="month"?dateOf(state.month,new Date(2026,state.month,0).getDate()):state.date;
 const text=[e.title,e.venue,e.regionName,e.categoryName].filter(Boolean).join(" ").normalize("NFKC").toLocaleLowerCase();
 return e.start<=end&&e.end>=start&&
  (state.region==="all"||e.prefecture===state.region)&&
  (state.category==="all"||e.category===state.category)&&
  text.includes(state.keyword.trim().normalize("NFKC").toLocaleLowerCase());
}
function txt(tag,value,className){const x=document.createElement(tag);x.textContent=value;if(className)x.className=className;return x;}
function render(){
 $("mode").value=state.mode;$("region").value=state.region;$("category").value=state.category;
 $("month").value=String(state.month);$("date").value=state.date;$("keyword").value=state.keyword;
 $("month-field").hidden=state.mode!=="month";$("date-field").hidden=state.mode!=="day";
 const results=events.filter(matches).sort((a,b)=>b.start.localeCompare(a.start)||b.end.localeCompare(a.end)||a.id.localeCompare(b.id));
 $("count").textContent=results.length+"条演示档案";
 const when=state.mode==="all"?"2026全年":state.mode==="month"?"2026年"+state.month+"月":state.date.replace(/-/g,"/");
 const where=state.region==="tokyo"?"东京都":state.region==="other"?"其他地区":"全部地区";
 $("filter-summary").textContent=when+" · "+where+" · "+(state.category==="all"?"所有类型":state.category==="staff_talk"?"制作人员座谈":"其他类型")+" · 日期从新到旧";
 const list=$("list");list.replaceChildren();
 if(!results.length){
  const x=txt("div","","empty");x.append(txt("strong","当前条件下没有已收录演示档案"),txt("span","请调整筛选条件。这不表示有关活动从未举办。"));list.append(x);return;
 }
 for(const e of results){
  const card=txt("article","","entry"),band=txt("div","✦ 2026年活动回忆 · 演示档案","entry-banner"),body=txt("div","","entry-body");
  body.append(txt("span",e.categoryName,"tag"),txt("h3",e.title),txt("p","📅 "+e.start+(e.end!==e.start?" ～ "+e.end:""),"meta"),txt("p","📍 "+e.regionName+" · "+e.venue,"meta"),txt("p",e.note,"note"));
  const q=stateQuery();q.set("id",e.id);q.set("from","archive");
  const link=txt("a","打开活动纪念册 →","detail");link.href="./event.html?"+q.toString();
  body.append(link);card.append(band,body);list.append(card);
 }
}
function init(){
 for(let i=1;i<=12;i++){const opt=txt("option",i+"月");opt.value=String(i);$("month").append(opt);}
 $("mode").addEventListener("change",e=>{state.mode=e.target.value;persist();render();});
 $("month").addEventListener("change",e=>{state.month=Number(e.target.value);persist();render();});
 $("date").addEventListener("change",e=>{if(!validDate(e.target.value)){render();return;}state.date=e.target.value;state.month=Number(state.date.slice(5,7));persist();render();});
 $("region").addEventListener("change",e=>{state.region=e.target.value;persist();render();});
 $("category").addEventListener("change",e=>{state.category=e.target.value;persist();render();});
 $("keyword").addEventListener("input",e=>{state.keyword=e.target.value;persist(true);render();});
 $("clear").addEventListener("click",()=>{state=readState(new URLSearchParams());persist();render();});
 window.addEventListener("popstate",()=>{state=readState(new URLSearchParams(location.search));render();});
}
(async()=>{
 try{
  const res=await fetch("./data/events-demo.json");if(!res.ok)throw Error("HTTP "+res.status);
  const data=await res.json();if(!Array.isArray(data.events))throw Error("演示档案格式异常");
  if(data.events.some(e=>!e.id||!e.title||!e.start||!e.end||!e.prefecture||!e.category))throw Error("演示档案必要字段缺失");
  events=data.events;init();render();
 }catch(e){$("count").textContent="加载失败";$("list").replaceChildren(txt("p","活动资料载入失败，请检查 GitHub Pages 部署和演示 JSON。"));console.error(e);}
})();
</script></body></html>
